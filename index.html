<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2a52">
<meta name="description" content="Restricted NSS Digital Participation Certificate Portal">
<title>NSS Certificate Portal</title>
<style>
:root{
  --navy:#071d3b; --navy2:#0c315d; --blue:#76c8f5; --sky:#a9e5ff;
  --card:#9ed7f2; --card2:#bceaff; --ink:#09284d; --white:#f8fcff;
  --muted:#d7e9f5; --danger:#ff8d9a; --success:#7ee0b1;
  --shadow-out: 14px 14px 28px rgba(2,14,34,.38), -8px -8px 18px rgba(255,255,255,.10);
  --shadow-in: inset 7px 7px 14px rgba(30,89,125,.22), inset -7px -7px 14px rgba(255,255,255,.40);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; min-height:100vh; color:var(--white);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 15% 10%, rgba(99,192,238,.18), transparent 28%),
    radial-gradient(circle at 88% 80%, rgba(75,143,210,.20), transparent 30%),
    linear-gradient(145deg,#06182f 0%,#0a2850 50%,#071b37 100%);
  overflow-x:hidden;
}
body:before,body:after{
  content:""; position:fixed; width:220px; height:220px; border-radius:42%;
  background:linear-gradient(145deg,rgba(126,210,247,.13),rgba(255,255,255,.025));
  filter:blur(.2px); pointer-events:none; z-index:-1;
}
body:before{top:-70px;right:-70px;transform:rotate(20deg)}
body:after{bottom:-90px;left:-80px;transform:rotate(-22deg)}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{width:min(100%,900px);margin:auto;padding:22px 16px 46px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#bdeaff,#6cb9e6);box-shadow:var(--shadow-out);color:#08305b;font-weight:900}
.brand h1{font-size:13px;letter-spacing:.16em;margin:0;text-transform:uppercase}
.brand small{display:block;color:#a9c9df;font-size:10px;margin-top:2px}
.clay{
  border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(145deg,rgba(172,225,247,.97),rgba(112,183,222,.96));
  color:var(--ink); border-radius:30px; box-shadow:var(--shadow-out),inset 1px 1px 0 rgba(255,255,255,.45);
}
.panel{padding:24px}
.hero{text-align:center;padding:34px 22px 26px}
.nss-badge{width:82px;height:82px;margin:0 auto 17px;border-radius:28px;display:grid;place-items:center;background:linear-gradient(145deg,#d5f4ff,#80c9eb);box-shadow:var(--shadow-out),var(--shadow-in);font-size:32px}
.kicker{font-size:11px;letter-spacing:.18em;font-weight:900;color:#24547d}
.hero h2{margin:8px 0 7px;font-size:clamp(28px,8vw,44px);line-height:1.03;letter-spacing:-.04em}
.hero p{margin:0 auto;color:#24547d;max-width:560px;line-height:1.55;font-size:14px}
.form{margin-top:18px;display:grid;gap:14px}
.field label{display:block;font-weight:800;font-size:12px;letter-spacing:.04em;margin:0 0 8px 6px}
.input{
  width:100%;border:0;outline:0;padding:16px 17px;border-radius:18px;color:var(--ink);
  background:rgba(206,241,255,.72);box-shadow:var(--shadow-in);transition:.2s;
}
.input:focus{box-shadow:var(--shadow-in),0 0 0 3px rgba(75,177,229,.22)}
.robot{
  display:flex;align-items:center;gap:12px;padding:15px 16px;border-radius:19px;
  background:linear-gradient(145deg,#bfeaff,#8bc8e8);box-shadow:var(--shadow-out);user-select:none;
  transition:.18s;min-height:58px
}
.robot:active{transform:translateY(2px);box-shadow:8px 8px 18px rgba(2,14,34,.25),-4px -4px 10px rgba(255,255,255,.22)}
.robot-box{width:27px;height:27px;border-radius:9px;background:#a7d9ef;box-shadow:var(--shadow-in);display:grid;place-items:center;font-weight:1000;color:#07517a;flex:0 0 auto}
.robot.checked .robot-box{background:linear-gradient(145deg,#caffdf,#69d99f);box-shadow:inset 3px 3px 7px rgba(30,110,76,.18),inset -3px -3px 7px rgba(255,255,255,.4);animation:pop .28s ease}
@keyframes pop{50%{transform:scale(1.16)}}
.robot-text strong{display:block;font-size:14px}.robot-text small{display:block;color:#38627e;font-size:10px;margin-top:2px}
.btn{
  width:100%;border:0;padding:16px 18px;border-radius:19px;font-weight:900;letter-spacing:.04em;
  color:#06294d;background:linear-gradient(145deg,#c8f1ff,#79c5e9);box-shadow:var(--shadow-out);
  transition:transform .16s,box-shadow .16s,opacity .16s;min-height:54px
}
.btn:hover{transform:translateY(-2px)} .btn:active{transform:translateY(2px);box-shadow:8px 8px 18px rgba(2,14,34,.25),-4px -4px 10px rgba(255,255,255,.22)}
.btn:disabled{opacity:.52;cursor:not-allowed;transform:none}
.btn.secondary{background:linear-gradient(145deg,#a9d8ed,#6eacd0)}
.btn.success{background:linear-gradient(145deg,#c6ffe1,#72dca8)}
.notice{padding:15px 17px;border-radius:20px;box-shadow:var(--shadow-in);background:rgba(207,241,255,.62);color:#153e60;font-size:13px;line-height:1.5}
.notice.error{background:linear-gradient(145deg,#ffd9df,#f4a7b3);color:#652632}
.notice.ok{background:linear-gradient(145deg,#d2ffe5,#8be2b7);color:#164d34}
.title-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:17px}
.title-row h2{margin:0;font-size:23px}.title-row p{margin:4px 0 0;color:#37627f;font-size:12px}
.step{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:12px;background:#bfeaff;box-shadow:var(--shadow-in);font-weight:900}
.details-grid{display:grid;gap:14px}
.readonly{opacity:.88}
.designations{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{border:0;text-align:left;padding:17px 14px;border-radius:20px;background:linear-gradient(145deg,#bce9fa,#82c6e5);box-shadow:var(--shadow-out);color:var(--ink);transition:.18s}
.choice strong{display:block;font-size:14px}.choice small{display:block;color:#3a6580;margin-top:4px;font-size:10px}
.choice.selected{transform:translateY(-3px);background:linear-gradient(145deg,#d2f5ff,#7fd2f3);box-shadow:9px 9px 18px rgba(2,14,34,.28),-6px -6px 13px rgba(255,255,255,.16),inset 0 0 0 2px rgba(255,255,255,.38)}
.certificate-wrap{margin-top:18px}
.certificate-frame{padding:10px;border-radius:26px;background:linear-gradient(145deg,#b8e7f8,#75b7d8);box-shadow:var(--shadow-out)}
.certificate-frame img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:contain;border-radius:17px;background:white}
.cert-actions{display:grid;gap:10px;margin-top:14px}
.processing{padding:20px}
.processing h2{text-align:center;margin:0;font-size:21px;letter-spacing:.04em}
.processing .sub{text-align:center;color:#37627f;font-size:12px;margin:6px 0 18px}
.scene{
  position:relative;height:210px;overflow:hidden;border-radius:28px;
  background:linear-gradient(180deg,#bdeaff 0%,#d9f5ff 58%,#9cd2ec 59%,#8ac2df 100%);
  box-shadow:var(--shadow-in);border:1px solid rgba(255,255,255,.35)
}
.cloud{position:absolute;width:75px;height:25px;border-radius:30px;background:rgba(255,255,255,.72);filter:blur(.2px);animation:cloud 16s linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}.cloud:before{width:30px;height:30px;left:12px;top:-14px}.cloud:after{width:40px;height:40px;right:10px;top:-20px}
.cloud.c1{top:32px;left:-100px}.cloud.c2{top:74px;left:-180px;animation-duration:22s;animation-delay:-8s;transform:scale(.7)}
@keyframes cloud{to{transform:translateX(900px)}}
.path{position:absolute;left:5%;right:5%;bottom:38px;height:8px;border-radius:9px;background:#79b5cf;box-shadow:inset 2px 2px 5px rgba(30,80,110,.18)}
.finish{position:absolute;right:5%;bottom:51px;text-align:center;color:#174c6e;font-weight:900;font-size:9px;letter-spacing:.08em}
.finish .flag{font-size:28px;line-height:1}
.runner{position:absolute;left:5%;bottom:48px;width:54px;height:75px;transform:translateX(0);transition:none}
.runner .head{position:absolute;top:0;left:16px;width:27px;height:27px;border-radius:50%;background:#ffd0ae;box-shadow:inset -3px -3px 5px rgba(150,70,40,.12)}
.runner .hair{position:absolute;top:-2px;left:15px;width:28px;height:13px;border-radius:15px 15px 7px 7px;background:#173451}
.runner .body{position:absolute;top:25px;left:18px;width:24px;height:31px;border-radius:11px 11px 8px 8px;background:#1b5c93;box-shadow:inset -4px -4px 7px rgba(0,20,50,.18)}
.runner .arm,.runner .leg{position:absolute;width:8px;border-radius:9px;background:#ffd0ae;transform-origin:top center}
.runner .arm{top:29px;height:25px;left:15px;animation:armA .35s infinite alternate ease-in-out}
.runner .arm.r{left:35px;animation:armB .35s infinite alternate ease-in-out}
.runner .leg{top:52px;height:25px;background:#173451;left:21px;animation:legA .35s infinite alternate ease-in-out}
.runner .leg.r{left:31px;animation:legB .35s infinite alternate ease-in-out}
@keyframes armA{to{transform:rotate(-38deg)}}@keyframes armB{to{transform:rotate(38deg)}}
@keyframes legA{to{transform:rotate(36deg)}}@keyframes legB{to{transform:rotate(-36deg)}}
.runner .bag{position:absolute;top:29px;left:39px;width:12px;height:18px;border-radius:5px;background:#f0a83b}
.progress-wrap{margin:17px 3px 0}.progress-track{height:16px;border-radius:12px;background:#8abbd4;box-shadow:var(--shadow-in);overflow:hidden;padding:3px}
.progress-bar{height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#1d75b7,#4ac8f1);box-shadow:0 2px 8px rgba(17,105,159,.32);transition:width .08s linear}
.progress-meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:11px;color:#37627f;font-weight:800}
.process-msg{text-align:center;margin:15px 0 0;min-height:22px;font-size:13px;font-weight:800;color:#1c5274}
.ready{animation:ready .6s ease both}
@keyframes ready{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
footer{text-align:center;color:#7fa8c2;font-size:10px;margin-top:22px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,120px);width:min(calc(100% - 28px),520px);padding:14px 16px;border-radius:18px;background:#bfeaff;color:#123d5d;box-shadow:var(--shadow-out);font-weight:800;font-size:12px;z-index:20;transition:.3s}
.toast.show{transform:translate(-50%,0)}
@media (min-width:720px){
  .app{padding:34px 22px 60px}.panel{padding:30px}.details-grid{grid-template-columns:1fr 1fr}.details-grid .full{grid-column:1/-1}
  .cert-actions{grid-template-columns:1fr 1fr}.hero{padding:46px 40px}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">NSS</div>
      <div><h1>Certificate Portal</h1><small>Digital Participation Certificate</small></div>
    </div>
  </header>

  <main id="appRoot"></main>

  <footer>
    Static GitHub Pages implementation • Frontend-only verification<br>
    Browser storage is not server security and can be bypassed by a knowledgeable user.
  </footer>
</div>
<div id="toast" class="toast"></div>

<script>
"use strict";

/*
  NSS CERTIFICATE PORTAL — STATIC GITHUB PAGES
  ---------------------------------------------------------------------------
  SECURITY LIMITATION:
  This is a static GitHub Pages implementation. There is no trusted server.
  localStorage/browser restrictions can potentially be bypassed by clearing
  site data, another browser, private browsing, developer tools, another
  device, or modifying client-side code/storage. This is NOT server-enforced
  authentication and cannot provide absolute one-device enforcement.
  True one-time generation enforcement requires a backend/database.

  The "I'm not a robot" control below is also only a basic frontend gate.
  It is NOT a real CAPTCHA. Real bot protection would require a service such
  as Cloudflare Turnstile or another CAPTCHA provider.

  The approved-name list is intentionally hard-coded and never exposed in
  the unauthorized UI. Client-side code cannot keep secrets from a determined
  user, so this list should be treated as an access UX restriction, not a
  security boundary.
*/

const APPROVED = Object.freeze({
  hiya:"Hiya", jiya:"Jiya", riya:"Riya", maya:"Maya", jaya:"Jaya", laya:"Laya",
  janana:"Janana", banana:"Banana", leafoya:"Leafoya", kijiyalaga:"Kijiyalaga",
  miyaliyta:"Miyaliyta"
});
const KEYS = Object.freeze({
  device:"nss_certificate_device_id",
  auth:"nss_certificate_auth",
  status:"nss_certificate_generation_status",
  data:"nss_certificate_data",
  timestamp:"nss_certificate_timestamp"
});
const PROCESS_MS = 30000;
const MESSAGES = [
  "Checking registered NSS name…",
  "Verifying student information…",
  "Confirming certificate eligibility…",
  "Preparing NSS certificate…",
  "Entering your verified name…",
  "Applying certificate details…",
  "Checking certificate quality…",
  "Preparing final preview…",
  "Almost ready…"
];

const root = document.getElementById("appRoot");
const toast = document.getElementById("toast");
let verified = null;
let processing = false;
let selectedDesignation = "";
let progressRAF = null;

function normalizeName(value){ return String(value || "").trim().toLowerCase(); }
function getDeviceId(){
  let id = localStorage.getItem(KEYS.device);
  if(!id){
    id = crypto && crypto.randomUUID ? crypto.randomUUID() :
      "nss-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
    localStorage.setItem(KEYS.device,id);
  }
  return id;
}
function readJSON(key){
  try { return JSON.parse(localStorage.getItem(key) || "null"); }
  catch(e){ return null; }
}
function writeJSON(key,val){ localStorage.setItem(key,JSON.stringify(val)); }
function showToast(msg){
  toast.textContent=msg; toast.classList.add("show");
  clearTimeout(showToast.t); showToast.t=setTimeout(()=>toast.classList.remove("show"),2600);
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function currentAuth(){ return readJSON(KEYS.auth); }
function studentRecord(){
  const auth=currentAuth();
  if(!auth || !auth.verifiedName) return null;
  const status=readJSON(KEYS.status);
  const data=readJSON(KEYS.data);
  return {auth,status,data};
}
function setScreen(html){ root.innerHTML=html; window.scrollTo({top:0,behavior:"smooth"}); }

function renderWelcome(message=""){
  setScreen(`
  <section class="clay panel hero">
    <div class="nss-badge">✦</div>
    <div class="kicker">NATIONAL SERVICE SCHEME</div>
    <h2>NSS CERTIFICATE PORTAL</h2>
    <p>Digital Participation Certificate</p>
    <div class="form" style="text-align:left">
      <div class="field">
        <label for="nameInput">REGISTERED NSS NAME</label>
        <input id="nameInput" class="input" autocomplete="off" autocapitalize="words" placeholder="Enter your registered name" maxlength="40">
      </div>
      <div id="robotGate" class="robot" role="checkbox" aria-checked="false" tabindex="0">
        <span class="robot-box" id="robotBox">○</span>
        <span class="robot-text"><strong>I'm not a robot</strong><small>Basic frontend verification gate</small></span>
      </div>
      ${message ? `<div class="notice error">${message}</div>` : ""}
      <button class="btn" id="verifyBtn">VERIFY &amp; CONTINUE</button>
    </div>
  </section>`);
  let checked=false;
  const gate=document.getElementById("robotGate");
  function toggleGate(){
    checked=!checked; gate.classList.toggle("checked",checked);
    gate.setAttribute("aria-checked",String(checked));
    document.getElementById("robotBox").textContent=checked?"✓":"○";
  }
  gate.addEventListener("click",toggleGate);
  gate.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();toggleGate()}});
  document.getElementById("verifyBtn").addEventListener("click",()=>{
    const name=document.getElementById("nameInput").value;
    if(!checked){ showToast("Verification required"); return; }
    const key=normalizeName(name);
    if(!APPROVED[key]){
      renderWelcome("This name is not registered for the NSS Certificate Portal.");
      return;
    }
    verified={verifiedName:APPROVED[key],normalizedName:key};
    writeJSON(KEYS.auth,{...verified,deviceId:getDeviceId(),verifiedAt:new Date().toISOString()});
    renderVerified();
  });
}

function renderVerified(){
  const name=escapeHTML(verified.verifiedName);
  setScreen(`
  <section class="clay panel hero">
    <div class="nss-badge" style="font-size:28px">✓</div>
    <div class="kicker">IDENTITY CHECK COMPLETE</div>
    <h2>Name Verified Successfully</h2>
    <p>Welcome, <strong>${name}</strong></p>
    <div class="form" style="text-align:left;margin-top:20px">
      <div class="notice ok">Your verified identity is now locked to this approved NSS record.</div>
      <button class="btn success" id="continueBtn">CONTINUE</button>
    </div>
  </section>`);
  document.getElementById("continueBtn").addEventListener("click",renderDetails);
}

function renderDetails(){
  const rec=studentRecord();
  if(!rec){renderWelcome();return;}
  verified=rec.auth;
  const existing=rec.status;
  if(existing && (existing.generated || existing.state==="used" || existing.state==="processing")){
    if(existing.state==="processing"){resumeProcessing(existing);return;}
    renderGenerated(existing);
    return;
  }
  selectedDesignation=(rec.data && rec.data.designation)||"";
  setScreen(`
  <section class="clay panel">
    <div class="title-row">
      <div><div class="kicker">STEP 02</div><h2>Student Details</h2><p>Complete the approved certificate details.</p></div>
      <span class="step">2</span>
    </div>
    <div class="details-grid">
      <div class="field full">
        <label>VERIFIED NAME — READ ONLY</label>
        <input class="input readonly" value="${escapeHTML(verified.verifiedName)}" readonly aria-readonly="true">
      </div>
      <div class="field">
        <label for="ageInput">AGE</label>
        <input id="ageInput" class="input" type="number" inputmode="numeric" min="15" max="60" placeholder="Enter your age" value="${rec.data?.age||""}">
      </div>
      <div class="field full">
        <label>DESIGNATION</label>
        <div class="designations">
          <button class="choice ${selectedDesignation==="NSS Volunteer"?"selected":""}" data-designation="NSS Volunteer"><strong>NSS Volunteer</strong><small>Student volunteer</small></button>
          <button class="choice ${selectedDesignation==="NSS Member"?"selected":""}" data-designation="NSS Member"><strong>NSS Member</strong><small>Registered NSS member</small></button>
        </div>
      </div>
      <div id="detailError" class="notice hidden full"></div>
      <div class="full"><button id="previewBtn" class="btn">PREVIEW CERTIFICATE</button></div>
    </div>
  </section>`);
  document.querySelectorAll("[data-designation]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      selectedDesignation=btn.dataset.designation;
      document.querySelectorAll("[data-designation]").forEach(x=>x.classList.toggle("selected",x===btn));
    });
  });
  document.getElementById("previewBtn").addEventListener("click",startGeneration);
}

function validateDetails(){
  const ageEl=document.getElementById("ageInput");
  const err=document.getElementById("detailError");
  const age=Number(ageEl.value);
  err.classList.add("hidden");
  if(!ageEl.value.trim()){err.textContent="Age Required — Please enter your age.";err.classList.remove("hidden");return null}
  if(!Number.isInteger(age)||age<15||age>60){err.textContent="Invalid Age — Please enter a valid age.";err.classList.remove("hidden");return null}
  if(!selectedDesignation){err.textContent="Designation Required — Please select NSS Volunteer or NSS Member.";err.classList.remove("hidden");return null}
  return {age,designation:selectedDesignation};
}

function startGeneration(){
  if(processing)return;
  const rec=studentRecord();
  if(!rec){renderWelcome();return}
  if(rec.status && (rec.status.generated||rec.status.state==="used")){renderGenerated(rec.status);return}
  const details=validateDetails(); if(!details)return;
  const record={
    state:"processing",generated:false,
    verifiedName:verified.verifiedName,normalizedName:verified.normalizedName,
    age:details.age,designation:details.designation,
    startedAt:Date.now(),deviceId:getDeviceId()
  };
  writeJSON(KEYS.data,record);
  writeJSON(KEYS.status,record);
  localStorage.setItem(KEYS.timestamp,new Date().toISOString());
  processing=true;
  renderProcessing(record,0);
}

function renderProcessing(record,offsetMs=0){
  setScreen(`
  <section class="clay panel processing">
    <div class="kicker" style="text-align:center">CERTIFICATE PROCESSING</div>
    <h2>Preparing your NSS certificate</h2>
    <p class="sub">Your verified details are being composed into the official template.</p>
    <div class="scene">
      <div class="cloud c1"></div><div class="cloud c2"></div>
      <div class="path"></div>
      <div class="finish"><div class="flag">🏁</div>CERTIFICATE<br>READY</div>
      <div class="runner" id="runner">
        <div class="hair"></div><div class="head"></div><div class="body"></div>
        <div class="arm"></div><div class="arm r"></div><div class="leg"></div><div class="leg r"></div><div class="bag"></div>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      <div class="progress-meta"><span>PROCESSING</span><span id="progressPct">0% complete</span></div>
    </div>
    <div id="processMsg" class="process-msg">Checking registered NSS name…</div>
  </section>`);
  runProgress(record,offsetMs);
}

function resumeProcessing(status){
  const elapsed=Math.max(0,Date.now()-Number(status.startedAt||Date.now()));
  if(elapsed>=PROCESS_MS){finishGeneration(status);return}
  processing=true; renderProcessing(status,elapsed);
}

function runProgress(record,offsetMs){
  cancelAnimationFrame(progressRAF);
  const start=performance.now()-Math.min(offsetMs,PROCESS_MS);
  let lastMessage=-1;
  function frame(now){
    if(!processing)return;
    const elapsed=Math.min(PROCESS_MS,Math.max(0,now-start));
    const pct=elapsed/PROCESS_MS;
    const whole=Math.floor(pct*100);
    const bar=document.getElementById("progressBar"), pctEl=document.getElementById("progressPct"), msg=document.getElementById("processMsg"), runner=document.getElementById("runner");
    if(!bar||!pctEl||!msg||!runner)return;
    bar.style.width=(pct*100).toFixed(2)+"%";
    pctEl.textContent=whole+"% complete";
    const idx=Math.min(MESSAGES.length-1,Math.floor(pct*MESSAGES.length));
    if(idx!==lastMessage){msg.textContent=MESSAGES[idx];lastMessage=idx}
    const x=Math.max(0,Math.min(88,pct*88));
    runner.style.left=(5+x*.9)+"%";
    if(elapsed<PROCESS_MS){progressRAF=requestAnimationFrame(frame)}
    else{finishGeneration(record)}
  }
  progressRAF=requestAnimationFrame(frame);
}

function finishGeneration(record){
  processing=false; cancelAnimationFrame(progressRAF);
  const finalRecord={
    ...record,state:"used",generated:true,generatedAt:new Date().toISOString()
  };
  writeJSON(KEYS.data,finalRecord);
  writeJSON(KEYS.status,finalRecord);
  localStorage.setItem(KEYS.timestamp,finalRecord.generatedAt);
  renderGenerated(finalRecord,true);
}

function renderGenerated(status,justFinished=false){
  verified=currentAuth();
  if(!verified){renderWelcome();return}
  setScreen(`
  <section class="clay panel ready">
    <div class="title-row">
      <div><div class="kicker">CERTIFICATE READY</div><h2>✓ Certificate Generated</h2><p>Your one-time generation has been consumed on this browser/device storage context.</p></div>
      <span class="step">✓</span>
    </div>
    <div class="notice ok"><strong>Certificate Already Generated</strong><br>Your certificate has already been generated on this device. You can download your existing certificate as many times as you want.</div>
    <div class="certificate-wrap">
      <div class="certificate-frame"><img id="certificatePreview" alt="NSS certificate preview"></div>
      <div class="cert-actions">
        <button class="btn success" id="downloadBtn">DOWNLOAD CERTIFICATE</button>
        <button class="btn secondary" id="viewBtn">VIEW MY CERTIFICATE</button>
      </div>
    </div>
  </section>`);
  const img=document.getElementById("certificatePreview");
  const render=()=>renderCertificate(status).then(data=>{img.src=data;img.dataset.ready="1";});
  render();
  document.getElementById("downloadBtn").addEventListener("click",async()=>{
    if(img.dataset.ready!=="1"){showToast("Preparing download…");await render();}
    const a=document.createElement("a");a.href=img.src;
    a.download=`NSS-Certificate-${verified.verifiedName.replace(/\s+/g,"-")}.jpg`;
    document.body.appendChild(a);a.click();a.remove();
  });
  document.getElementById("viewBtn").addEventListener("click",()=>img.scrollIntoView({behavior:"smooth",block:"center"}));
}

async function loadTemplate(){
  return new Promise((resolve,reject)=>{
    const img=new Image(); img.onload=()=>resolve(img); img.onerror=reject;
    img.src="certificate-template.png";
  });
}

/*
  Certificate rendering:
  - The supplied image is used as the complete, authoritative background.
  - The existing printed name is covered only within its existing name field.
  - The verified approved name is drawn into that field.
  - No URL parameter can control the name.
  - The designation is captured and locked in the application, but the supplied
    template has no appropriate designation field, so it is NOT printed over
    existing official wording.
*/
async function renderCertificate(status){
  const bg=await loadTemplate();
  const SCALE=2;
  const canvas=document.createElement("canvas");
  canvas.width=bg.naturalWidth*SCALE; canvas.height=bg.naturalHeight*SCALE;
  const ctx=canvas.getContext("2d");
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality="high";
  ctx.drawImage(bg,0,0,canvas.width,canvas.height);

  // Source certificate name field bounds measured against the supplied 1536×864 template.
  // These coordinates intentionally target only the dynamic name field.
  const x=768*SCALE, y=347*SCALE;
  const coverW=720*SCALE, coverH=74*SCALE;
  ctx.save();
  ctx.fillStyle="#fffefa";
  ctx.fillRect(x-coverW/2,y-coverH/2,coverW,coverH);
  // Recreate the small gold separators that sit beneath the name field.
    ctx.restore();

  const name=status.verifiedName;
  let fontSize=74*SCALE;
  if(name.length>14)fontSize=64*SCALE;
  if(name.length>18)fontSize=56*SCALE;
  if(name.length>22)fontSize=49*SCALE;
  ctx.save();
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillStyle="#071f58";
  // Prefer installed script fonts so the certificate stays dependency-light.
  ctx.font=`italic ${fontSize}px "Segoe Script","Brush Script MT","URW Chancery L",cursive`;
  ctx.fillText(name,x,y-3*SCALE);
  ctx.restore();

  // High-resolution printable/shareable JPEG. The canvas remains exactly 16:9.
  return canvas.toDataURL("image/jpeg",0.94);
}

function boot(){
  try{getDeviceId()}catch(e){}
  const rec=studentRecord();
  if(rec && rec.auth){
    verified=rec.auth;
    if(rec.status?.state==="processing"){resumeProcessing(rec.status);return}
    if(rec.status?.generated || rec.status?.state==="used"){renderGenerated(rec.status);return}
    renderDetails();return;
  }
  renderWelcome();
}
boot();
</script>
